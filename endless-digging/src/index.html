<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PAGE-START-->
<title>Endless Digging</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="style.css">
<!--HEAD-END-->
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" hidden>
  <div class="panel tl"><div id="money" class="money">$0.00</div><div id="coords"></div><div id="alt"></div><div id="core"></div><div id="clock" class="mono"></div></div>
  <div class="panel tr"><div id="dug"></div><small id="leftLbl"></small><div id="left" class="mono"></div><div id="pct" class="mono dim"></div></div>
  <div id="cross"></div>
  <button id="bShop" class="shopBtn"></button>
  <button id="bScan" class="shopBtn scanBtn" hidden></button>
  <button id="bDrive" class="shopBtn driveBtn" hidden></button>
  <div id="notice" hidden></div>
  <div id="geo" class="geo" hidden></div>
  <button id="bMap" class="tmap" aria-label="Map"><i data-icon="globe"></i><span>M</span></button>
  <div id="floaters"></div>
  <div id="clickHint" hidden></div>
  <div id="stick" hidden><div id="knob"></div></div>
  <div class="tbtns"><button id="bJump" class="tbtn"><b data-icon="jump"></b><span></span></button><button id="bDig" class="tbtn dig"><b data-icon="shovel"></b><span></span></button></div>
  <button id="bPause" class="tpause" aria-label="Pause">Ⅱ</button>
  <div id="turnHint"></div>
</div>
<div id="mapUI" hidden><div class="mapHead"><h2 id="mapTitle"></h2><p id="mapHint"></p></div><button id="mapClose" aria-label="Close">✕</button>
  <div class="mapLegend"><div class="lgTop"><span class="lg open"></span><b id="mapOpen"></b><span class="lg locked"></span><b id="mapLocked"></b><span class="lgT" id="resTitle"></span></div><div class="mapRes"></div></div></div>
<div id="shop" hidden></div>
<div id="admin" hidden></div>
<div id="stats" hidden></div>
<div id="overlay" hidden></div>
<script src="vendor/three.min.js"></script>
