<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!--GAME-START-->
<title>Dino Island</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1b8a9a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one-screen app. Stats bar → orders strip → 7×9 merge board → item info → tabs. Island tab swaps the middle. */
:root {
  --sea: #1b8a9a;
  --sea-deep: #0f5965;
  --sand: #f6e2ae;
  --sand-2: #efd598;
  --leaf: #3f9e4f;
  --coral: #ff7a59;
  --sun: #ffc94a;
  --ink: #2b2118;
  --paper: #fffaf0;
  --muted: #8a7a62;
  --display: "Russo One", "Arial Black", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --cell: 48px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: linear-gradient(180deg, #2aa7b5 0%, var(--sea) 45%, var(--sea-deep) 100%);
  color: var(--ink); font-family: var(--body);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
#app {
  height: 100%; display: flex; flex-direction: column; gap: 8px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 6px);
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  max-width: 560px; margin: 0 auto;
}

/* stats */
#stats { display: flex; gap: 6px; align-items: center; }
.pill {
  display: flex; align-items: center; gap: 5px; background: var(--paper); border-radius: 999px;
  padding: 4px 10px 4px 6px; font-family: var(--display); font-size: 16px; font-variant-numeric: tabular-nums;
  box-shadow: 0 3px 0 rgba(0,0,0,.18); border: none; min-width: 0;
}
.pill .ico { font-family: var(--emoji); font-size: 18px; }
.pill small { font-family: var(--body); font-weight: 800; font-size: 10px; color: var(--muted); }
#energyPill { flex-direction: row; }
#energyPill .col { display: flex; flex-direction: column; line-height: 1; }
#energyPill .plus { background: var(--leaf); color: #fff; border-radius: 50%; width: 18px; height: 18px; display: grid; place-items: center; font-size: 14px; margin-left: 2px; }
#stats .grow { flex: 1; }
#chapter { font-family: var(--display); color: #fff; font-size: 13px; text-shadow: 0 2px 0 rgba(0,0,0,.25); text-align: right; line-height: 1.1; }

/* orders */
#orders { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; min-height: 96px; }
#orders::-webkit-scrollbar { display: none; }
.order {
  flex: 0 0 auto; min-width: 120px; background: var(--paper); border-radius: 16px; padding: 8px 10px;
  display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center;
  box-shadow: 0 3px 0 rgba(0,0,0,.18); position: relative; transition: transform .2s;
}
.order.ready { background: #eaffd9; box-shadow: 0 3px 0 #6bb04a; }
.order .who { font-family: var(--emoji); font-size: 30px; grid-row: span 2; line-height: 1; }
.order .needs { display: flex; gap: 4px; }
.need { position: relative; width: 36px; height: 36px; border-radius: 10px; background: var(--sand); display: grid; place-items: center; font-family: var(--emoji); font-size: 22px; }
.need.have::after { content: "✓"; position: absolute; right: -4px; bottom: -4px; background: var(--leaf); color: #fff; font: 900 11px/16px var(--body); width: 16px; height: 16px; border-radius: 50%; text-align: center; }
.order .reward { font-size: 12px; font-weight: 800; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.order .go { grid-column: 1 / -1; background: var(--leaf); color: #fff; border: none; border-radius: 10px; font: 400 14px var(--display); padding: 6px; box-shadow: 0 3px 0 #2c7a3a; }
.order .go:active { transform: translateY(2px); box-shadow: 0 1px 0 #2c7a3a; }

/* board */
#boardWrap { flex: 1; min-height: 0; display: grid; place-items: center; }
#board {
  display: grid; grid-template-columns: repeat(7, var(--cell)); grid-auto-rows: var(--cell); gap: 3px;
  padding: 6px; background: #c9a86a; border-radius: 18px; box-shadow: inset 0 0 0 3px rgba(255,255,255,.25), 0 6px 0 rgba(0,0,0,.2);
}
.cell {
  position: relative; border-radius: 10px; background: var(--sand); display: grid; place-items: center;
  font-family: var(--emoji); font-size: calc(var(--cell) * .62); line-height: 1; touch-action: none;
}
.cell:nth-child(odd) { background: var(--sand-2); }
.cell .it { transition: transform .15s; pointer-events: none; }
.cell .lv { position: absolute; left: 3px; bottom: 2px; font: 900 calc(var(--cell) * .2) var(--body); color: var(--muted); pointer-events: none; }
.cell.gen { background: radial-gradient(circle, #fff3c4 0%, #ffd56b 100%); box-shadow: inset 0 0 0 2px #e0a52b; }
.cell.gen::before { content: "⚡"; position: absolute; right: 2px; top: 1px; font-size: calc(var(--cell) * .22); }
.cell.sel { box-shadow: inset 0 0 0 3px #fff, 0 0 0 2px var(--coral); z-index: 2; }
.cell.match::after { content: "✓"; position: absolute; right: 2px; top: 2px; background: var(--leaf); color: #fff; font: 900 calc(var(--cell)*.2)/calc(var(--cell)*.3) var(--body); width: calc(var(--cell)*.3); height: calc(var(--cell)*.3); border-radius: 50%; text-align: center; pointer-events: none; }
.cell.locked { background: #a9cf86; }
.cell.locked .it { opacity: .85; transform: scale(.85); }
.cell.locked::before { content: ""; position: absolute; inset: 0; border-radius: 10px; pointer-events: none;
  background: repeating-linear-gradient(45deg, rgba(40,90,30,.35) 0 3px, transparent 3px 12px), repeating-linear-gradient(-45deg, rgba(40,90,30,.3) 0 2px, transparent 2px 13px); }
.cell.drag-src .it { opacity: .25; }
.cell.hover { box-shadow: inset 0 0 0 3px var(--sun); }
.cell.pop .it { animation: pop .35s ease-out; }
.cell.shake { animation: shake .3s; }
@keyframes pop { 0% { transform: scale(.3); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
@keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
#ghost { position: fixed; z-index: 50; pointer-events: none; font-family: var(--emoji); transform: translate(-50%, -60%) scale(1.25); filter: drop-shadow(0 6px 6px rgba(0,0,0,.3)); line-height: 1; }

/* info bar */
#info { display: flex; align-items: center; gap: 10px; background: var(--paper); border-radius: 16px; padding: 8px 10px; min-height: 56px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
#info .big { font-family: var(--emoji); font-size: 30px; line-height: 1; }
#info .txt { flex: 1; min-width: 0; }
#info .name { font-family: var(--display); font-size: 15px; }
#info .desc { font-size: 12px; color: var(--muted); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chainrow { font-family: var(--emoji); font-size: 14px; letter-spacing: 1px; }
.chainrow .q { filter: grayscale(1) brightness(.3); opacity: .35; }
#sellBtn { border: none; background: var(--coral); color: #fff; border-radius: 12px; padding: 8px 10px; font: 400 13px var(--display); box-shadow: 0 3px 0 #c4522f; }

/* tabs */
#tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tab { position: relative; border: none; border-radius: 14px; padding: 10px; font: 400 16px var(--display); background: rgba(255,255,255,.35); color: #fff; }
.tab.on { background: var(--paper); color: var(--ink); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.tab .badge { position: absolute; top: -4px; right: 10px; background: var(--coral); color: #fff; font: 900 11px/18px var(--body); min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; }

/* island */
#islandView { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; }
#scene {
  position: relative; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; flex: 0 0 auto; border-radius: 22px; overflow: hidden;
  background: radial-gradient(ellipse 48% 40% at 50% 56%, #7bd389 0 70%, var(--sand) 71% 86%, #7fdde3 87% 93%, transparent 94%), linear-gradient(#5cc4d0, #1b8a9a);
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.25);
}
.spot { position: absolute; transform: translate(-50%, -50%); font-family: var(--emoji); font-size: clamp(24px, 8vw, 38px); line-height: 1; transition: filter .4s, transform .4s; }
.spot.off { filter: grayscale(1) brightness(1.4) opacity(.35); }
.spot.next { animation: bob 1.2s ease-in-out infinite; filter: none; }
.spot.next::after { content: "❗"; position: absolute; right: -12px; top: -12px; font-size: 16px; }
@keyframes bob { 50% { transform: translate(-50%, -62%); } }
.card { background: var(--paper); border-radius: 18px; padding: 14px; box-shadow: 0 3px 0 rgba(0,0,0,.18); display: grid; gap: 8px; }
.card h3 { margin: 0; font: 400 18px var(--display); text-wrap: balance; }
.card p { margin: 0; font-size: 14px; line-height: 1.4; }
.progress { height: 10px; background: #eadfc6; border-radius: 6px; overflow: hidden; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--sun), var(--coral)); }
.btn { border: none; border-radius: 14px; padding: 12px; font: 400 17px var(--display); background: linear-gradient(#ffd166, #ff9f1c); color: #3a1a05; box-shadow: 0 4px 0 #b5642a; }
.btn:disabled { background: #e3d9c4; color: var(--muted); box-shadow: 0 4px 0 #c4b89d; }
.btn.ghost { background: transparent; box-shadow: none; color: var(--muted); font: 800 13px var(--body); padding: 6px; }
.clues { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }
.clues li { display: flex; gap: 8px; }
.clues .e { font-family: var(--emoji); }

/* dialog + toast */
#dialog { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; background: rgba(10,40,45,.35);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); }
#dialog .box { width: min(520px, 100%); background: var(--paper); border-radius: 20px; padding: 16px; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
#dialog .av { font-family: var(--emoji); font-size: 48px; line-height: 1; grid-row: span 2; }
#dialog .who { font: 400 16px var(--display); color: var(--coral); }
#dialog .say { font-size: 16px; line-height: 1.4; font-weight: 600; }
#dialog .btn { grid-column: 1 / -1; }
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 60px); transform: translateX(-50%); z-index: 70; background: rgba(43,33,24,.92); color: #fff; padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 14px; max-width: calc(100% - 32px); text-align: center; transition: opacity .3s; pointer-events: none; }
#shop { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(10,40,45,.45); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#shop .card { width: min(340px, 100%); text-align: center; }
.bump { animation: bump .4s; }
@keyframes bump { 50% { transform: scale(1.2); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<!--HEAD-END-->
</head>
<body>
<div id="app">
  <div id="stats">
    <button class="pill" id="energyPill" aria-label="Энергия, купить ещё"><span class="ico">⚡</span><span class="col"><span id="energy">100</span><small id="energyTimer"></small></span><span class="plus">+</span></button>
    <div class="pill" id="coinPill"><span class="ico">💰</span><span id="coins">0</span></div>
    <div class="pill" id="starPill"><span class="ico">⭐</span><span id="stars">0</span></div>
    <div class="grow"></div>
    <div id="chapter"></div>
  </div>

  <div id="mergeView" style="display:contents">
    <div id="orders"></div>
    <div id="boardWrap"><div id="board"></div></div>
    <div id="info"></div>
  </div>

  <div id="islandView" hidden>
    <div id="scene"></div>
    <div class="card" id="taskCard"></div>
    <div class="card"><h3>🔍 Улики</h3><ul class="clues" id="clues"></ul></div>
    <div class="card"><button class="btn ghost" id="resetBtn">Начать игру заново</button></div>
  </div>

  <div id="tabs">
    <button class="tab on" id="tabMerge">🎲 Поле<span class="badge" id="badgeMerge" hidden></span></button>
    <button class="tab" id="tabIsland">🏝️ Остров<span class="badge" id="badgeIsland" hidden>!</span></button>
  </div>
</div>

<div id="ghost" hidden></div>
<div id="toast" style="opacity:0"></div>
<div id="dialog" hidden><div class="box"><div class="av" id="dAv"></div><div class="who" id="dWho"></div><div class="say" id="dSay"></div><button class="btn" id="dNext">Дальше</button></div></div>
<div id="shop" hidden><div class="card">
  <h3>⚡ Энергия</h3>
  <p>Энергия тратится на гнёзда и деревья. Она восстанавливается сама: +1 каждые 12 секунд.</p>
  <button class="btn" id="buyEnergy">+25 ⚡ за 20 💰</button>
  <button class="btn ghost" id="closeShop">Закрыть</button>
</div></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const COLS = 7, ROWS = 9, N = COLS * ROWS;
const MAX_E = 100, E_REGEN_MS = 12000, SAVE_KEY = 'dino-island-merge-v1';

// ---------- content ----------
const CHAINS = {
  egg:   { gen: '🧺', genName: 'Гнездо-корзинка', items: [['🥚','Яйцо'],['🐣','Вылупыш'],['🐥','Птенчик'],['🦎','Ящерка'],['🐊','Крокодильчик'],['🦕','Бронтозаврик'],['🦖','Тирекс']] },
  fruit: { gen: '🌳', genName: 'Фруктовое дерево', items: [['🍇','Виноград'],['🍒','Вишня'],['🍓','Клубника'],['🍑','Персик'],['🥭','Манго'],['🍍','Ананас'],['🍉','Арбуз']] },
  shell: { gen: '⛱️', genName: 'Пляжный зонтик', items: [['🐚','Ракушка'],['🦐','Креветка'],['🦀','Краб'],['🐠','Рыбка'],['🐡','Рыба-ёж'],['🐙','Осьминог'],['🐬','Дельфин']] },
  stone: { gen: '🌋', genName: 'Вулкан', items: [['🧱','Кирпич'],['🏺','Амфора'],['🗿','Идол'],['🔮','Шар'],['💎','Кристалл'],['👑','Корона']] }
};
const WHO = {
  pip:   { e: '🦕', n: 'Пип' },
  kora:  { e: '🐢', n: 'Бабушка Кора' },
  kesha: { e: '🦜', n: 'Капитан Кеша' },
  mo:    { e: '🐸', n: 'Лягушонок Мо' },
  vetta: { e: '🦅', n: 'Ветта' }
};
// Island restoration = story chapters
const TASKS = [
  { t: 'Расчистить пляж', cost: 1, icon: '🏖️', x: 72, y: 74,
    after: [['pip','Ура, пляж чистый! Ой… смотри, на песке огромные следы с тремя когтями.'],['pip','Такие лапы не у дино. Запишу в улики!']],
    clue: ['🐾','Следы с тремя когтями на пляже'] },
  { t: 'Построить хижину Пипа', cost: 2, icon: '⛺', x: 36, y: 58, unlock: 'shell', newWho: 'kesha',
    after: [['kesha','Карр! Капитан Кеша на связи. Я видел ночью большую тень над вулканом!'],['kesha','Держи пляжный зонтик: под ним всегда найдутся ракушки.']],
    clue: ['🌑','Ночью над вулканом летает большая тень'] },
  { t: 'Починить мостик', cost: 2, icon: '🌉', x: 56, y: 44,
    after: [['kora','Мостик снова цел, внучек. А это что под ним застряло?'],['kora','Перо! Длинное, кожистое… Такие перья я видела только в старых сказках.']],
    clue: ['✒️','Огромное кожистое перо под мостиком'] },
  { t: 'Зажечь фонарь у бухты', cost: 3, icon: '🏮', x: 18, y: 46, unlock: 'stone', newWho: 'mo',
    after: [['mo','Привет! Я Мо, живу в бухте. Свет фонаря разбудил вулкан, и он начал выбрасывать камни.'],['mo','Камни можно соединять. Из них получаются настоящие сокровища!']],
    clue: ['🔥','Вулкан снова проснулся'] },
  { t: 'Посадить сад', cost: 3, icon: '🌻', x: 30, y: 76,
    after: [['pip','Сад! Смотри, у пустых гнёзд лежат тёплые камешки из вулкана.'],['pip','Кто-то будто пытался согреть яйца…']],
    clue: ['♨️','Тёплые камни возле пустых гнёзд'] },
  { t: 'Построить причал', cost: 4, icon: '⛵', x: 86, y: 52,
    after: [['kesha','Причал готов! С мачты видно: тень всегда улетает в пещеру на склоне вулкана.']],
    clue: ['🕳️','Тень прячется в пещере на вулкане'] },
  { t: 'Проложить тропу к вулкану', cost: 4, icon: '👣', x: 36, y: 32,
    after: [['kora','Тропа открыта. Будь осторожен, внучек. Ночи стали холодными, а вулкан тёплый…']],
    clue: ['❄️','Ночи на острове стали холодными'] },
  { t: 'Зажечь факелы в пещере', cost: 5, icon: '🔦', x: 64, y: 20, newWho: 'vetta',
    after: [['vetta','Ой! Не бойтесь… Я Ветта, птерозавр. Это я уносила яйца.'],['vetta','Ночью было так холодно! Я грела их у лавы, чтобы малыши не замёрзли.'],['pip','Так вот кто это был! Ветта, давай построим тёплый дом для всех яиц!']],
    clue: ['🦅','Тайна раскрыта: Ветта грела яйца у лавы'] },
  { t: 'Построить тёплый инкубатор', cost: 5, icon: '🏡', x: 60, y: 66,
    after: [['vetta','Здесь тепло даже холодной ночью. Спасибо! Теперь все яйца в безопасности.']],
    clue: ['🥚','Все яйца теперь в тепле'] },
  { t: 'Устроить праздник острова', cost: 6, icon: '🎉', x: 46, y: 46,
    after: [['pip','Праздник! Остров снова живой, а у нас появился новый друг.'],['kora','Ты молодец. Заказы будут приходить и дальше, остров всегда рад помощи.']],
    clue: ['🎆','Остров восстановлен!'] }
];
const INTRO = [
  ['pip','Привет! Я Пип. Добро пожаловать на Дино-остров!'],
  ['pip','У нас беда: по ночам пропадают яйца, а остров совсем зарос.'],
  ['pip','Нажимай на корзинку 🧺 и дерево 🌳, чтобы получать предметы. Перетащи два одинаковых предмета друг на друга, и они станут лучше!'],
  ['kora','А я Бабушка Кора. Выполняй наши заказы наверху, за них дают звёзды ⭐.'],
  ['pip','За звёзды мы восстановим остров и раскроем тайну пропавших яиц!']
];

// ---------- state ----------
const store = {
  get() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(v)); } catch (e) {} },
  clear() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
};
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const idx = (r, c) => r * COLS + c;

function newState() {
  const board = Array(N).fill(null), locked = Array(N).fill(false);
  board[idx(0, 1)] = { g: 'egg' };
  board[idx(0, 5)] = { g: 'fruit' };
  board[idx(2, 2)] = { c: 'egg', l: 1 };
  board[idx(2, 4)] = { c: 'egg', l: 1 };
  board[idx(3, 3)] = { c: 'fruit', l: 1 };
  for (let r = 5; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const i = idx(r, c); locked[i] = true;
    if (Math.random() < 0.7) board[i] = { c: pick(['egg', 'fruit']), l: 1 + (Math.random() < 0.3 ? 1 : 0) };
  }
  board[idx(7, 3)] = { gift: 1 };
  return {
    board, locked, energy: MAX_E, eTs: Date.now(), coins: 10, stars: 0,
    task: 0, chains: ['egg', 'fruit'], who: ['pip', 'kora'], orders: [], oid: 1,
    found: { 'egg:1': 1, 'fruit:1': 1 }, introDone: false, hintStar: false, sel: -1
  };
}
let S = store.get();
if (!S || !S.board || S.board.length !== N) S = newState();
const save = () => store.set(S);

// ---------- helpers ----------
const item = (c, l) => CHAINS[c].items[l - 1];
const maxL = c => CHAINS[c].items.length;
function neighbors(i) {
  const r = Math.floor(i / COLS), c = i % COLS, out = [];
  if (r > 0) out.push(i - COLS); if (r < ROWS - 1) out.push(i + COLS);
  if (c > 0) out.push(i - 1); if (c < COLS - 1) out.push(i + 1);
  return out;
}
function nearestEmpty(from) {
  const fr = Math.floor(from / COLS), fc = from % COLS; let best = -1, bd = 1e9;
  for (let i = 0; i < N; i++) if (!S.board[i] && !S.locked[i]) {
    const d = Math.hypot(Math.floor(i / COLS) - fr, i % COLS - fc);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 1800); }
const bump = id => { const e = $(id); e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); };
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// sound
let ac = null;
function tone(f, d = .1, type = 'sine', v = .07, delay = 0) {
  if (!ac) return; const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
}
document.addEventListener('pointerdown', () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } else if (ac.state === 'suspended') ac.resume(); }, { once: false });
const sfx = {
  spawn: () => tone(520, .08, 'triangle'),
  merge: l => { tone(400 + l * 80, .1, 'triangle', .08); tone(600 + l * 100, .14, 'triangle', .08, .07); },
  deliver: () => [523, 659, 784].forEach((f, i) => tone(f, .14, 'square', .05, i * .08)),
  build: () => [392, 523, 659, 784, 1046].forEach((f, i) => tone(f, .18, 'triangle', .07, i * .09)),
  no: () => tone(180, .15, 'sawtooth', .05)
};

// ---------- energy ----------
function tickEnergy() {
  const now = Date.now();
  if (S.energy >= MAX_E) { S.eTs = now; return; }
  const gained = Math.floor((now - S.eTs) / E_REGEN_MS);
  if (gained > 0) { S.energy = Math.min(MAX_E, S.energy + gained); S.eTs += gained * E_REGEN_MS; if (S.energy >= MAX_E) S.eTs = now; }
}
function useEnergy() {
  tickEnergy();
  if (S.energy <= 0) { sfx.no(); toast('Нет энергии! Подожди или купи ⚡'); openShop(); return false; }
  if (S.energy >= MAX_E) S.eTs = Date.now();
  S.energy--; return true;
}

// ---------- orders ----------
function makeOrder() {
  const prog = S.task;
  const count = prog >= 2 && Math.random() < 0.45 ? 2 : 1;
  const need = [];
  for (let k = 0; k < count; k++) {
    const c = pick(S.chains);
    const cap = Math.min(maxL(c), 2 + Math.floor(prog * 0.5) + (Math.random() < 0.3 ? 1 : 0));
    const lo = Math.max(1, cap - 2);
    need.push({ c, l: lo + rnd(cap - lo + 1) });
  }
  const top = Math.max(...need.map(n => n.l));
  const coins = need.reduce((s, n) => s + 2 * Math.pow(2, n.l - 1), 0);
  return { id: S.oid++, who: pick(S.who), need, coins, stars: top >= 5 ? 2 : 1 };
}
function fillOrders() { while (S.orders.length < 3) S.orders.push(makeOrder()); }
function availableCounts() {
  const m = {};
  S.board.forEach((b, i) => { if (b && b.c && !S.locked[i]) { const k = b.c + ':' + b.l; m[k] = (m[k] || 0) + 1; } });
  return m;
}
function orderReady(o, counts) {
  const m = Object.assign({}, counts);
  return o.need.every(n => { const k = n.c + ':' + n.l; if (m[k] > 0) { m[k]--; return true; } return false; });
}
function deliver(id) {
  const o = S.orders.find(x => x.id === id); if (!o || !orderReady(o, availableCounts())) return;
  o.need.forEach(n => { const i = S.board.findIndex((b, j) => b && b.c === n.c && b.l === n.l && !S.locked[j]); if (i >= 0) S.board[i] = null; });
  S.coins += o.coins; S.stars += o.stars; S.sel = -1;
  S.orders = S.orders.filter(x => x.id !== id);
  sfx.deliver(); buzz(20); bump('coinPill'); bump('starPill');
  toast(`${WHO[o.who].n}: спасибо! +${o.coins} 💰 +${o.stars} ⭐`);
  fillOrders(); save(); render();
  if (!S.hintStar && S.task === 0 && S.stars >= TASKS[0].cost) {
    S.hintStar = true; save();
    setTimeout(() => say([['pip','У тебя есть звезда! Открой вкладку «Остров» внизу и начни восстанавливать пляж.']]), 500);
  }
}

// ---------- board actions ----------
let flash = {};
function produce(i) {
  const g = S.board[i].g, to = nearestEmpty(i);
  if (to < 0) { sfx.no(); toast('Поле заполнено! Соедини или продай предметы.'); flash[i] = 'shake'; render(); return; }
  if (!useEnergy()) { render(); return; }
  const l = Math.random() < 0.15 ? 2 : 1;
  S.board[to] = { c: g, l }; discover(g, l);
  flash[to] = 'pop'; sfx.spawn(); save(); render();
}
function openGift(i) {
  S.board[i] = null; let made = 0;
  for (let k = 0; k < 3; k++) {
    const to = nearestEmpty(i); if (to < 0) break;
    const c = pick(S.chains), l = 1 + rnd(3);
    S.board[to] = { c, l }; discover(c, l); flash[to] = 'pop'; made++;
  }
  if (!made) { S.board[i] = { gift: 1 }; toast('Освободи место, чтобы открыть подарок'); return render(); }
  S.energy = Math.min(MAX_E + 50, S.energy + 10);
  sfx.merge(3); toast('Подарок! +10 ⚡ и предметы'); save(); render();
}
function discover(c, l) {
  const k = c + ':' + l; if (S.found[k]) return;
  S.found[k] = 1;
  if (l > 1) { const bonus = l * 2; S.coins += bonus; const [e, n] = item(c, l); setTimeout(() => toast(`Новое: ${e} ${n}! +${bonus} 💰`), 50); }
}
function drop(from, to) {
  if (from === to || to < 0) return;
  const A = S.board[from], B = S.board[to];
  if (S.locked[to]) {
    if (B && A.c && B.c === A.c && B.l === A.l && A.l < maxL(A.c)) { S.locked[to] = false; } else { flash[to] = 'shake'; sfx.no(); return render(); }
  }
  if (!B) { S.board[to] = A; S.board[from] = null; S.sel = to; }
  else if (A.c && B.c === A.c && B.l === A.l && A.l < maxL(A.c)) {
    const nl = A.l + 1;
    S.board[to] = { c: A.c, l: nl }; S.board[from] = null; S.sel = to;
    neighbors(to).forEach(n => { if (S.locked[n]) { S.locked[n] = false; flash[n] = 'pop'; } });
    discover(A.c, nl); flash[to] = 'pop'; sfx.merge(nl); buzz(12);
  } else if (A.c && B.c === A.c && B.l === A.l) { toast('Это уже максимальный уровень!'); return; }
  else { S.board[to] = A; S.board[from] = B; S.sel = to; }
  save(); render();
}
function sellSel() {
  const b = S.board[S.sel]; if (!b || !b.c) return;
  const price = b.l; S.coins += price; S.board[S.sel] = null; S.sel = -1;
  toast(`Продано за ${price} 💰`); bump('coinPill'); save(); render();
}

// ---------- rendering ----------
let tab = 'merge';
function render() {
  tickEnergy();
  $('energy').textContent = S.energy; $('coins').textContent = S.coins; $('stars').textContent = S.stars;
  $('chapter').innerHTML = S.task < TASKS.length ? `Глава ${S.task + 1}/${TASKS.length}<br>${TASKS[S.task].t}` : 'Остров<br>восстановлен!';
  const counts = availableCounts();
  const readyN = S.orders.filter(o => orderReady(o, counts)).length;
  $('badgeMerge').hidden = !readyN; $('badgeMerge').textContent = readyN;
  $('badgeIsland').hidden = !(S.task < TASKS.length && S.stars >= TASKS[S.task].cost);
  if (tab === 'merge') { renderOrders(counts); renderBoard(counts); renderInfo(); } else renderIsland();
  flash = {};
}
function renderOrders(counts) {
  $('orders').innerHTML = S.orders.map(o => {
    const ready = orderReady(o, counts), m = Object.assign({}, counts);
    const needs = o.need.map(n => { const k = n.c + ':' + n.l, have = m[k] > 0; if (have) m[k]--; return `<div class="need ${have ? 'have' : ''}" title="${item(n.c, n.l)[1]}">${item(n.c, n.l)[0]}</div>`; }).join('');
    return `<div class="order ${ready ? 'ready' : ''}"><div class="who" title="${WHO[o.who].n}">${WHO[o.who].e}</div><div class="needs">${needs}</div>
      <div class="reward">💰${o.coins} ⭐${o.stars}</div>${ready ? `<button class="go" data-o="${o.id}">Сдать</button>` : ''}</div>`;
  }).join('');
}
function renderBoard(counts) {
  const wanted = {};
  S.orders.forEach(o => o.need.forEach(n => wanted[n.c + ':' + n.l] = 1));
  let h = '';
  for (let i = 0; i < N; i++) {
    const b = S.board[i], cls = ['cell']; let inner = '';
    if (S.locked[i]) cls.push('locked');
    if (i === S.sel) cls.push('sel');
    if (flash[i]) cls.push(flash[i]);
    if (b) {
      if (b.g) { cls.push('gen'); inner = `<span class="it">${CHAINS[b.g].gen}</span>`; }
      else if (b.gift) inner = `<span class="it">🎁</span>`;
      else { inner = `<span class="it">${item(b.c, b.l)[0]}</span><span class="lv">${b.l}</span>`; if (!S.locked[i] && wanted[b.c + ':' + b.l]) cls.push('match'); }
    }
    h += `<div class="${cls.join(' ')}" data-i="${i}">${inner}</div>`;
  }
  $('board').innerHTML = h;
}
function chainRow(c, cur) {
  return '<span class="chainrow">' + CHAINS[c].items.map(([e], k) => S.found[c + ':' + (k + 1)] || k + 1 <= cur ? e : `<span class="q">${e}</span>`).join('') + '</span>';
}
function renderInfo() {
  const b = S.board[S.sel]; let h;
  if (!b) h = `<div class="big">🦕</div><div class="txt"><div class="name">Нажми на предмет</div><div class="desc">Соединяй два одинаковых, чтобы улучшить</div></div>`;
  else if (b.g) h = `<div class="big">${CHAINS[b.g].gen}</div><div class="txt"><div class="name">${CHAINS[b.g].genName}</div><div class="desc">Нажми: −1 ⚡ → ${chainRow(b.g, 0)}</div></div>`;
  else if (b.gift) h = `<div class="big">🎁</div><div class="txt"><div class="name">Подарок</div><div class="desc">Нажми, чтобы открыть</div></div>`;
  else {
    const [e, n] = item(b.c, b.l), mx = maxL(b.c);
    const lockedTxt = S.locked[S.sel] ? 'В зарослях: положи сверху такой же предмет' : (b.l < mx ? `Ур. ${b.l}/${mx} · ` + chainRow(b.c, b.l) : 'Максимальный уровень! ' + chainRow(b.c, b.l));
    h = `<div class="big">${e}</div><div class="txt"><div class="name">${n}</div><div class="desc">${lockedTxt}</div></div>${S.locked[S.sel] ? '' : `<button id="sellBtn">Продать ${b.l}💰</button>`}`;
  }
  $('info').innerHTML = h;
  const sb = $('sellBtn'); if (sb) sb.onclick = sellSel;
}
function renderIsland() {
  $('scene').innerHTML = TASKS.map((t, k) => `<div class="spot ${k < S.task ? '' : 'off'} ${k === S.task ? 'next' : ''}" style="left:${t.x}%;top:${t.y}%">${k < S.task || k === S.task ? t.icon : '❔'}</div>`).join('')
    + `<div class="spot" style="left:50%;top:14%;font-size:clamp(30px,10vw,48px)">🌋</div>`;
  const tc = $('taskCard');
  if (S.task < TASKS.length) {
    const t = TASKS[S.task], ok = S.stars >= t.cost;
    tc.innerHTML = `<h3>${t.icon} ${t.t}</h3><p>Глава ${S.task + 1} из ${TASKS.length}. Нужно звёзд: ${t.cost} ⭐ (у тебя ${S.stars}).</p>
      <div class="progress"><i style="width:${Math.min(100, S.stars / t.cost * 100)}%"></i></div>
      <button class="btn" id="buildBtn" ${ok ? '' : 'disabled'}>${ok ? `Сделать за ${t.cost} ⭐` : 'Выполняй заказы на поле'}</button>`;
    $('buildBtn').onclick = build;
  } else tc.innerHTML = `<h3>🎆 Остров восстановлен!</h3><p>Тайна раскрыта, все яйца в тепле. Выполняй заказы дальше и собирай самые редкие предметы.</p>`;
  const found = TASKS.slice(0, S.task).map(t => `<li><span class="e">${t.clue[0]}</span><span>${t.clue[1]}</span></li>`);
  $('clues').innerHTML = found.length ? found.join('') : '<li><span class="e">❔</span><span>Пока улик нет. Восстанавливай остров, чтобы их найти.</span></li>';
}
function build() {
  const t = TASKS[S.task]; if (!t || S.stars < t.cost) return;
  S.stars -= t.cost; S.task++;
  if (t.unlock && !S.chains.includes(t.unlock)) {
    S.chains.push(t.unlock);
    let p = nearestEmpty(idx(0, 3)); if (p < 0) p = S.board.findIndex((b, i) => b && b.c && !S.locked[i]);
    if (p >= 0) S.board[p] = { g: t.unlock };
  }
  if (t.newWho && !S.who.includes(t.newWho)) S.who.push(t.newWho);
  const g = nearestEmpty(idx(4, 3)); if (g >= 0) S.board[g] = { gift: 1 };
  sfx.build(); buzz(40); save(); render();
  say(t.after.concat(t.unlock ? [['pip', `На поле появился ${CHAINS[t.unlock].gen} ${CHAINS[t.unlock].genName}! И я положил тебе подарок 🎁.`]] : [['pip','Я положил тебе на поле подарок 🎁!']]));
}

// ---------- dialog ----------
let dq = [], dDone = null;
function say(lines, cb) { dq = lines.slice(); dDone = cb || null; nextLine(); }
function nextLine() {
  if (!dq.length) { $('dialog').hidden = true; const f = dDone; dDone = null; f && f(); return; }
  const [w, txt] = dq.shift(); $('dAv').textContent = WHO[w].e; $('dWho').textContent = WHO[w].n; $('dSay').textContent = txt;
  $('dNext').textContent = dq.length ? 'Дальше' : 'Понятно!'; $('dialog').hidden = false;
}
$('dNext').onclick = nextLine;

// ---------- shop / tabs / reset ----------
function openShop() { $('shop').hidden = false; }
$('energyPill').onclick = openShop;
$('closeShop').onclick = () => $('shop').hidden = true;
$('buyEnergy').onclick = () => {
  if (S.coins < 20) { sfx.no(); toast('Не хватает монет. Продавай предметы и выполняй заказы.'); return; }
  S.coins -= 20; S.energy += 25; sfx.deliver(); bump('energyPill'); save(); render(); $('shop').hidden = true;
};
function setTab(t) {
  tab = t; $('tabMerge').classList.toggle('on', t === 'merge'); $('tabIsland').classList.toggle('on', t === 'island');
  $('mergeView').style.display = t === 'merge' ? 'contents' : 'none'; $('islandView').hidden = t !== 'island';
  render(); if (t === 'merge') sizeBoard();
}
$('tabMerge').onclick = () => setTab('merge');
$('tabIsland').onclick = () => setTab('island');
let resetArmed = false;
$('resetBtn').onclick = () => {
  if (!resetArmed) { resetArmed = true; $('resetBtn').textContent = 'Точно? Нажми ещё раз — прогресс удалится'; setTimeout(() => { resetArmed = false; $('resetBtn').textContent = 'Начать игру заново'; }, 3000); return; }
  store.clear(); S = newState(); fillOrders(); save(); setTab('merge'); say(INTRO, () => { S.introDone = true; save(); });
};
$('orders').addEventListener('click', e => { const b = e.target.closest('[data-o]'); if (b) deliver(+b.dataset.o); });

// ---------- input on board ----------
const ghost = $('ghost'); let drag = null;
$('board').addEventListener('pointerdown', e => {
  const cell = e.target.closest('.cell'); if (!cell) return;
  const i = +cell.dataset.i, b = S.board[i];
  if (!b) { S.sel = -1; render(); return; }
  drag = { i, x0: e.clientX, y0: e.clientY, on: false, hover: -1 };
  e.preventDefault();
});
window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.on && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) {
    if (S.locked[drag.i]) { drag = null; return; }
    drag.on = true; const b = S.board[drag.i];
    ghost.textContent = b.g ? CHAINS[b.g].gen : b.gift ? '🎁' : item(b.c, b.l)[0];
    ghost.style.fontSize = getComputedStyle(document.documentElement).getPropertyValue('--cell').trim().replace('px', '') * 0.62 + 'px';
    ghost.hidden = false;
    const src = $('board').children[drag.i]; src && src.classList.add('drag-src');
  }
  if (drag.on) {
    ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
    const el = document.elementFromPoint(e.clientX, e.clientY), c = el && el.closest('.cell');
    const h = c ? +c.dataset.i : -1;
    if (h !== drag.hover) { const kids = $('board').children; if (drag.hover >= 0 && kids[drag.hover]) kids[drag.hover].classList.remove('hover'); if (h >= 0 && h !== drag.i) kids[h].classList.add('hover'); drag.hover = h; }
  }
});
function endDrag(e) {
  if (!drag) return; const d = drag; drag = null; ghost.hidden = true;
  if (d.on) { const el = document.elementFromPoint(e.clientX, e.clientY), c = el && el.closest('.cell'); if (c) drop(d.i, +c.dataset.i); else render(); return; }
  const b = S.board[d.i]; S.sel = d.i;
  if (S.locked[d.i]) { toast('Заросли! Соедини предметы рядом, чтобы расчистить'); return render(); }
  if (b.g) produce(d.i); else if (b.gift) openGift(d.i); else render();
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', () => { if (drag) { drag = null; ghost.hidden = true; render(); } });

// ---------- sizing ----------
function sizeBoard() {
  const wrap = $('boardWrap'); if (!wrap.clientHeight) return;
  const w = wrap.clientWidth - 12 - 18, h = wrap.clientHeight - 12 - 24;
  const cell = Math.max(30, Math.floor(Math.min(w / COLS, h / ROWS, 64)));
  document.documentElement.style.setProperty('--cell', cell + 'px');
}
window.addEventListener('resize', sizeBoard);

// energy timer
setInterval(() => {
  const before = S.energy; tickEnergy();
  if (S.energy !== before) { $('energy').textContent = S.energy; save(); }
  const t = $('energyTimer');
  if (S.energy < MAX_E) { const s = Math.ceil((E_REGEN_MS - (Date.now() - S.eTs)) / 1000); t.textContent = '+1 через 0:' + String(Math.max(0, s)).padStart(2, '0'); }
  else t.textContent = 'полно';
}, 500);

// boot
fillOrders(); save(); render(); sizeBoard();
requestAnimationFrame(sizeBoard);
if (!S.introDone) setTimeout(() => say(INTRO, () => { S.introDone = true; save(); }), 300);
})();
</script>
<!--GAME-END-->
</body>
