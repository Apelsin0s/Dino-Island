<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!--GAME-START-->
<title>Dino Island</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b3a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one full-screen canvas (the island), a thin HUD strip on top, modal cards for start / game over. */
:root {
  --sea-deep: #0b3a4a;
  --sea: #13708a;
  --sand: #f2d38b;
  --leaf: #4caf50;
  --lava: #ff6a1f;
  --ink: #fff7e6;
  --card: rgba(9, 34, 44, 0.86);
  --display: "Russo One", "Arial Black", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: var(--sea-deep);
  color: var(--ink);
  font-family: var(--body);
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-family: var(--display); font-size: 20px;
  text-shadow: 0 2px 0 rgba(0,0,0,.35);
  pointer-events: none;
}
#hud .stat { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
#hearts { letter-spacing: 2px; color: #ff5470; }
#pauseBtn {
  pointer-events: auto; font: inherit; font-size: 18px; color: var(--ink);
  background: rgba(0,0,0,.25); border: 2px solid rgba(255,255,255,.35); border-radius: 12px;
  width: 42px; height: 38px; cursor: pointer;
}
.overlay {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(4, 20, 28, .45);
}
.card {
  width: min(360px, 100%); box-sizing: border-box;
  background: var(--card); border: 2px solid rgba(242, 211, 139, .35); border-radius: 22px;
  padding: 26px 22px; text-align: center; display: grid; gap: 14px;
  box-shadow: 0 18px 40px rgba(0,0,0,.4);
}
.card h1 {
  font-family: var(--display); font-weight: 400; margin: 0;
  font-size: clamp(34px, 11vw, 46px); line-height: 1; color: var(--sand);
  text-shadow: 0 4px 0 #b5642a; text-wrap: balance;
}
.card h2 { font-family: var(--display); font-weight: 400; margin: 0; font-size: 30px; color: var(--lava); }
.card p { margin: 0; font-size: 16px; line-height: 1.45; opacity: .92; }
.card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 15px; text-align: left; }
.card li { display: flex; gap: 10px; align-items: baseline; }
.card li b { font-family: var(--display); font-weight: 400; color: var(--sand); min-width: 22px; }
.big { font-family: var(--display); font-size: 54px; line-height: 1; color: var(--sand); font-variant-numeric: tabular-nums; }
.btn {
  font-family: var(--display); font-size: 22px; color: #3a1a05;
  background: linear-gradient(#ffd166, #ff9f1c); border: none; border-radius: 16px;
  padding: 14px 18px; cursor: pointer; box-shadow: 0 5px 0 #b5642a;
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b5642a; }
.btn:focus-visible, #pauseBtn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.small { font-size: 13px; opacity: .7; }
[hidden] { display: none !important; }
</style>
<!--HEAD-END-->
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div class="stat" id="hearts">♥♥♥</div>
  <div class="stat"><span>🥚</span><span id="score">0</span></div>
  <div class="stat"><span id="level">Ур. 1</span><button id="pauseBtn" aria-label="Пауза">II</button></div>
</div>

<div class="overlay" id="startScreen">
  <div class="card">
    <h1>Dino Island</h1>
    <p>Вулкан проснулся! Помоги динозаврику собрать яйца и не попасть под лаву.</p>
    <ul>
      <li><b>👆</b><span>Веди пальцем по экрану — дино бежит туда</span></li>
      <li><b>🥚</b><span>Собирай яйца, золотое даёт +3</span></li>
      <li><b>🔥</b><span>Красный круг — сюда упадёт лава, убегай</span></li>
      <li><b>🍓</b><span>Ягода восстанавливает сердечко</span></li>
    </ul>
    <button class="btn" id="startBtn">Играть</button>
    <p class="small" id="bestStart"></p>
  </div>
</div>

<div class="overlay" id="pauseScreen" hidden>
  <div class="card">
    <h2>Пауза</h2>
    <button class="btn" id="resumeBtn">Продолжить</button>
  </div>
</div>

<div class="overlay" id="overScreen" hidden>
  <div class="card">
    <h2>Ой, лава!</h2>
    <div class="big" id="finalScore">0</div>
    <p id="finalText">яиц собрано</p>
    <p class="small" id="bestOver"></p>
    <button class="btn" id="againBtn">Ещё раз</button>
  </div>
</div>

<script>
(() => {
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const $ = id => document.getElementById(id);
  const hud = $('hud'), startScreen = $('startScreen'), overScreen = $('overScreen'), pauseScreen = $('pauseScreen');

  // ---------- storage (safe) ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  let best = parseInt(store.get('dino-island-best') || '0', 10) || 0;
  const showBest = () => {
    const t = best > 0 ? 'Рекорд: ' + best : '';
    $('bestStart').textContent = t; $('bestOver').textContent = t;
  };
  showBest();

  // ---------- sound ----------
  let audio = null;
  function initAudio() {
    if (audio) return;
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
  }
  function beep(freq, dur, type = 'square', vol = 0.08, slide = 0) {
    if (!audio) return;
    const t = audio.currentTime;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
  }
  const sfx = {
    egg() { beep(660, .08, 'square', .06); setTimeout(() => beep(990, .1, 'square', .06), 70); },
    gold() { [660, 880, 1320].forEach((f, i) => setTimeout(() => beep(f, .1, 'square', .06), i * 70)); },
    boom() { beep(140, .35, 'sawtooth', .1, -100); },
    hurt() { beep(300, .3, 'triangle', .12, -220); },
    heal() { beep(520, .12, 'sine', .1, 300); },
    level() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .12, 'triangle', .08), i * 90)); }
  };
  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  // ---------- layout ----------
  let W = 0, H = 0, DPR = 1, CX = 0, CY = 0, R = 100;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const top = 64;
    R = Math.max(80, Math.min(W * 0.46, (H - top - 24) * 0.46));
    CX = W / 2; CY = top + (H - top) / 2;
  }
  window.addEventListener('resize', resize);
  resize();
  const px = x => CX + x * R, py = y => CY + y * R;

  // ---------- world ----------
  const VOLCANO_R = 0.2, EDGE = 0.9, DINO_R = 0.065;
  const palms = [[-0.72, -0.38], [0.66, -0.5], [-0.55, 0.62], [0.74, 0.42], [0.05, -0.86]];
  let state = 'menu';
  let dino, eggs, bombs, puddles, berries, parts, score, level, lives, inv, bombTimer, berryTimer, goldTimer, shake, time, floatTexts;

  function reset() {
    dino = { x: 0, y: 0.5, vx: 0, vy: 0, face: 1, step: 0 };
    eggs = []; bombs = []; puddles = []; berries = []; parts = []; floatTexts = [];
    score = 0; level = 1; lives = 3; inv = 0; bombTimer = 1.5; berryTimer = 12; goldTimer = 9; shake = 0; time = 0;
    spawnEgg(false);
    updateHud();
  }

  function randomSpot(minDistFromDino = 0.3) {
    for (let i = 0; i < 40; i++) {
      const a = Math.random() * Math.PI * 2, r = VOLCANO_R + 0.1 + Math.random() * (EDGE - VOLCANO_R - 0.15);
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      if (!dino || Math.hypot(x - dino.x, y - dino.y) > minDistFromDino) return { x, y };
    }
    return { x: 0.5, y: 0 };
  }
  function spawnEgg(gold) {
    const s = randomSpot(0.35);
    eggs.push({ x: s.x, y: s.y, gold, life: gold ? 6 : Infinity, t: 0, hue: Math.floor(Math.random() * 4) });
  }

  // ---------- input ----------
  const input = { active: false, ox: 0, oy: 0, x: 0, y: 0, keys: {} };
  cvs.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    input.active = true; input.ox = input.x = e.clientX; input.oy = input.y = e.clientY;
    try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cvs.addEventListener('pointermove', e => { if (input.active) { input.x = e.clientX; input.y = e.clientY; } });
  const end = () => { input.active = false; };
  cvs.addEventListener('pointerup', end); cvs.addEventListener('pointercancel', end);
  window.addEventListener('keydown', e => { input.keys[e.key.toLowerCase()] = true; if (e.key === 'Escape' || e.key === 'p') togglePause(); });
  window.addEventListener('keyup', e => { input.keys[e.key.toLowerCase()] = false; });

  function inputDir() {
    let dx = 0, dy = 0;
    const k = input.keys;
    if (k['arrowleft'] || k['a'] || k['ф']) dx -= 1;
    if (k['arrowright'] || k['d'] || k['в']) dx += 1;
    if (k['arrowup'] || k['w'] || k['ц']) dy -= 1;
    if (k['arrowdown'] || k['s'] || k['ы']) dy += 1;
    if (input.active) {
      const ddx = input.x - input.ox, ddy = input.y - input.oy, d = Math.hypot(ddx, ddy);
      if (d > 6) { const m = Math.min(1, d / 50); dx = ddx / d * m; dy = ddy / d * m; }
    }
    const l = Math.hypot(dx, dy);
    if (l > 1) { dx /= l; dy /= l; }
    return { dx, dy };
  }

  // ---------- effects ----------
  function burst(x, y, n, colors, speed = 0.8, life = 0.6) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random());
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, c: colors[i % colors.length], r: 0.012 + Math.random() * 0.015 });
    }
  }
  function floatText(x, y, text, color) { floatTexts.push({ x, y, text, color, t: 0 }); }

  // ---------- update ----------
  function hurt() {
    if (inv > 0) return;
    lives--; inv = 1.6; shake = 0.4; sfx.hurt(); buzz(120);
    burst(dino.x, dino.y, 14, ['#ff5470', '#ffd166'], 0.9);
    updateHud();
    if (lives <= 0) gameOver();
  }

  function update(dt) {
    time += dt;
    // dino movement
    const { dx, dy } = inputDir();
    const speed = 0.85;
    dino.vx += (dx * speed - dino.vx) * Math.min(1, dt * 12);
    dino.vy += (dy * speed - dino.vy) * Math.min(1, dt * 12);
    dino.x += dino.vx * dt; dino.y += dino.vy * dt;
    if (Math.abs(dino.vx) > 0.05) dino.face = dino.vx > 0 ? 1 : -1;
    const sp = Math.hypot(dino.vx, dino.vy);
    dino.step += sp * dt * 28;
    // keep on island, out of volcano
    let d = Math.hypot(dino.x, dino.y);
    if (d > EDGE) { dino.x *= EDGE / d; dino.y *= EDGE / d; }
    d = Math.hypot(dino.x, dino.y);
    const minD = VOLCANO_R + DINO_R * 0.7;
    if (d < minD) { if (d < 1e-4) { dino.x = 0; dino.y = minD; } else { dino.x *= minD / d; dino.y *= minD / d; } }
    if (inv > 0) inv -= dt;

    // eggs
    for (let i = eggs.length - 1; i >= 0; i--) {
      const e = eggs[i]; e.t += dt;
      if (e.gold) { e.life -= dt; if (e.life <= 0) { eggs.splice(i, 1); continue; } }
      if (Math.hypot(e.x - dino.x, e.y - dino.y) < DINO_R + 0.05) {
        eggs.splice(i, 1);
        const pts = e.gold ? 3 : 1;
        addScore(pts, e.x, e.y);
        if (e.gold) { sfx.gold(); burst(e.x, e.y, 18, ['#ffd700', '#fff3b0']); }
        else { sfx.egg(); burst(e.x, e.y, 10, ['#fff7e6', '#9be7ff']); spawnEgg(false); }
        buzz(15);
      }
    }
    goldTimer -= dt;
    if (goldTimer <= 0 && level >= 2) { spawnEgg(true); goldTimer = 10 + Math.random() * 6; }

    // berries
    berryTimer -= dt;
    if (berryTimer <= 0) {
      if (lives < 3 && berries.length === 0) { const s = randomSpot(0.3); berries.push({ x: s.x, y: s.y, t: 0, life: 8 }); }
      berryTimer = 14 + Math.random() * 8;
    }
    for (let i = berries.length - 1; i >= 0; i--) {
      const b = berries[i]; b.t += dt; b.life -= dt;
      if (b.life <= 0) { berries.splice(i, 1); continue; }
      if (Math.hypot(b.x - dino.x, b.y - dino.y) < DINO_R + 0.05) {
        berries.splice(i, 1);
        if (lives < 3) lives++;
        sfx.heal(); burst(b.x, b.y, 12, ['#ff3b6b', '#7bd389']); floatText(b.x, b.y, '+♥', '#ff5470'); updateHud();
      }
    }

    // lava bombs
    bombTimer -= dt;
    if (bombTimer <= 0) {
      const count = level >= 6 ? 2 : 1;
      for (let i = 0; i < count; i++) launchBomb(i === 0 && Math.random() < 0.55);
      bombTimer = Math.max(0.45, 1.7 - level * 0.14) * (0.7 + Math.random() * 0.6);
    }
    for (let i = bombs.length - 1; i >= 0; i--) {
      const b = bombs[i]; b.t += dt;
      if (b.t >= b.dur) {
        bombs.splice(i, 1);
        sfx.boom(); buzz(30);
        const near = Math.hypot(b.x - dino.x, b.y - dino.y);
        shake = Math.max(shake, near < 0.5 ? 0.25 : 0.1);
        burst(b.x, b.y, 16, ['#ff6a1f', '#ffd166', '#5a2a16'], 1.0, 0.7);
        puddles.push({ x: b.x, y: b.y, r: b.r, t: 0, life: 0.9 });
        if (near < b.r + DINO_R * 0.6) hurt();
      }
    }
    for (let i = puddles.length - 1; i >= 0; i--) {
      const p = puddles[i]; p.t += dt;
      if (p.t >= p.life) { puddles.splice(i, 1); continue; }
      if (p.t < p.life * 0.6 && Math.hypot(p.x - dino.x, p.y - dino.y) < p.r * 0.75 + DINO_R * 0.4) hurt();
    }

    // particles
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92;
    }
    for (let i = floatTexts.length - 1; i >= 0; i--) { const f = floatTexts[i]; f.t += dt; if (f.t > 1) floatTexts.splice(i, 1); }
    if (shake > 0) shake -= dt;
  }

  function launchBomb(aimAtDino) {
    let tx, ty;
    if (aimAtDino) {
      // lead the target a little so standing still is not safe
      tx = dino.x + dino.vx * 0.5 + (Math.random() - 0.5) * 0.15;
      ty = dino.y + dino.vy * 0.5 + (Math.random() - 0.5) * 0.15;
      const d = Math.hypot(tx, ty);
      if (d > EDGE) { tx *= EDGE / d; ty *= EDGE / d; }
      if (d < VOLCANO_R + 0.08) { const s = randomSpot(0); tx = s.x; ty = s.y; }
    } else { const s = randomSpot(0); tx = s.x; ty = s.y; }
    const dur = Math.max(0.8, 1.45 - level * 0.06);
    bombs.push({ x: tx, y: ty, t: 0, dur, r: 0.12 + Math.random() * 0.05 + Math.min(level, 8) * 0.004 });
  }

  function addScore(pts, x, y) {
    score += pts;
    floatText(x, y, '+' + pts, pts > 1 ? '#ffd700' : '#fff7e6');
    const newLevel = 1 + Math.floor(score / 8);
    if (newLevel > level) {
      level = newLevel; sfx.level(); floatText(0, -0.35, 'Уровень ' + level + '!', '#ffd166');
    }
    updateHud();
  }

  function updateHud() {
    $('hearts').textContent = '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, 3 - lives));
    $('score').textContent = score;
    $('level').textContent = 'Ур. ' + level;
  }

  // ---------- drawing ----------
  function drawSea() {
    const g = ctx.createRadialGradient(CX, CY, R * 0.8, CX, CY, Math.max(W, H));
    g.addColorStop(0, '#1d93a8'); g.addColorStop(0.35, '#13708a'); g.addColorStop(1, '#0b3a4a');
    ctx.fillStyle = g; ctx.fillRect(-50, -50, W + 100, H + 100);
    // wave rings
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const ph = ((time * 0.25 + i / 4) % 1);
      ctx.strokeStyle = `rgba(255,255,255,${0.22 * (1 - ph)})`;
      ctx.beginPath(); ctx.arc(CX, CY, R * (1.05 + ph * 0.5), 0, Math.PI * 2); ctx.stroke();
    }
  }
  function drawIsland() {
    // shallow water
    ctx.fillStyle = '#5fd0d6';
    ctx.beginPath(); ctx.arc(CX, CY, R * 1.06, 0, Math.PI * 2); ctx.fill();
    // sand
    ctx.fillStyle = '#f2d38b';
    ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.fill();
    // grass
    const g = ctx.createRadialGradient(CX, CY - R * 0.2, R * 0.1, CX, CY, R * 0.85);
    g.addColorStop(0, '#7bd389'); g.addColorStop(1, '#3f9e4f');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(CX, CY, R * 0.84, 0, Math.PI * 2); ctx.fill();
    // grass tufts (deterministic)
    ctx.strokeStyle = 'rgba(30,90,40,.45)'; ctx.lineWidth = Math.max(1.5, R * 0.008);
    for (let i = 0; i < 40; i++) {
      const a = i * 2.399, r = 0.3 + ((i * 37) % 50) / 100;
      const x = px(Math.cos(a) * r), y = py(Math.sin(a) * r), s = R * 0.025;
      ctx.beginPath(); ctx.moveTo(x - s, y); ctx.lineTo(x - s * 0.5, y - s * 1.3); ctx.moveTo(x, y); ctx.lineTo(x, y - s * 1.6); ctx.moveTo(x + s, y); ctx.lineTo(x + s * 0.5, y - s * 1.3); ctx.stroke();
    }
  }
  function drawVolcano() {
    const x = CX, y = CY, r = VOLCANO_R * R;
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.beginPath(); ctx.ellipse(x, y + r * 0.25, r * 1.15, r * 0.9, 0, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r * 1.1);
    g.addColorStop(0, '#a0674a'); g.addColorStop(1, '#5a3424');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 1.05, 0, Math.PI * 2); ctx.fill();
    const pulse = 0.5 + 0.5 * Math.sin(time * 5);
    const lg = ctx.createRadialGradient(x, y, 0, x, y, r * 0.5);
    lg.addColorStop(0, '#fff3b0'); lg.addColorStop(0.4, '#ffb347'); lg.addColorStop(1, '#d6361b');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(x, y, r * (0.42 + pulse * 0.05), 0, Math.PI * 2); ctx.fill();
    // smoke puffs
    for (let i = 0; i < 4; i++) {
      const ph = (time * 0.35 + i / 4) % 1;
      ctx.fillStyle = `rgba(70,60,60,${0.35 * (1 - ph)})`;
      ctx.beginPath(); ctx.arc(x + Math.sin(i * 2 + time) * r * 0.3, y - ph * r * 2.2, r * (0.25 + ph * 0.45), 0, Math.PI * 2); ctx.fill();
    }
  }
  function drawPalm(nx, ny) {
    const x = px(nx), y = py(ny), s = R * 0.09;
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    ctx.beginPath(); ctx.ellipse(x, y + s * 0.2, s * 1.2, s * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = s * 0.28; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + s * 0.4, y - s, x + s * 0.15, y - s * 1.8); ctx.stroke();
    ctx.fillStyle = '#2e8b3d';
    const tx = x + s * 0.15, ty = y - s * 1.8, sw = Math.sin(time * 1.5 + nx * 5) * 0.08;
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i - 2) * 0.75 + sw;
      ctx.beginPath(); ctx.ellipse(tx + Math.cos(a) * s * 0.6, ty + Math.sin(a) * s * 0.35 + s * 0.15, s * 0.7, s * 0.2, a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#6b3e1f';
    ctx.beginPath(); ctx.arc(tx - s * 0.1, ty + s * 0.1, s * 0.12, 0, Math.PI * 2); ctx.arc(tx + s * 0.12, ty + s * 0.12, s * 0.12, 0, Math.PI * 2); ctx.fill();
  }
  const eggColors = [['#fff7e6', '#9be7ff'], ['#e6fff0', '#7bd389'], ['#fff0f5', '#ff9ec7'], ['#f3ecff', '#b79bff']];
  function drawEgg(e) {
    const bob = Math.sin(e.t * 4) * R * 0.008;
    const x = px(e.x), y = py(e.y) + bob, s = R * 0.045;
    if (e.gold && e.life < 2 && Math.floor(e.life * 8) % 2 === 0) return;
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.beginPath(); ctx.ellipse(x, py(e.y) + s * 1.1, s * 0.8, s * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    if (e.gold) {
      ctx.fillStyle = `rgba(255,215,0,${0.25 + 0.15 * Math.sin(e.t * 8)})`;
      ctx.beginPath(); ctx.arc(x, y, s * 2, 0, Math.PI * 2); ctx.fill();
    }
    const [base, spot] = e.gold ? ['#ffd700', '#ffb300'] : eggColors[e.hue];
    ctx.fillStyle = base; ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(x, y, s * 0.78, s, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = spot;
    ctx.beginPath(); ctx.arc(x - s * 0.25, y - s * 0.2, s * 0.17, 0, Math.PI * 2); ctx.arc(x + s * 0.3, y + s * 0.25, s * 0.13, 0, Math.PI * 2); ctx.arc(x + s * 0.05, y + s * 0.6, s * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.beginPath(); ctx.ellipse(x - s * 0.3, y - s * 0.45, s * 0.15, s * 0.25, -0.4, 0, Math.PI * 2); ctx.fill();
  }
  function drawBerry(b) {
    if (b.life < 2 && Math.floor(b.life * 8) % 2 === 0) return;
    const x = px(b.x), y = py(b.y) + Math.sin(b.t * 4) * R * 0.008, s = R * 0.04;
    ctx.fillStyle = 'rgba(255,84,112,.25)'; ctx.beginPath(); ctx.arc(x, y, s * 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8304f'; ctx.beginPath(); ctx.moveTo(x, y + s); ctx.bezierCurveTo(x - s * 1.3, y, x - s * 0.9, y - s * 1.1, x, y - s * 0.7); ctx.bezierCurveTo(x + s * 0.9, y - s * 1.1, x + s * 1.3, y, x, y + s); ctx.fill();
    ctx.fillStyle = '#ffe08a';
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(x + Math.cos(i * 1.3) * s * 0.4, y - s * 0.1 + Math.sin(i * 1.3) * s * 0.35, s * 0.07, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = '#3f9e4f'; ctx.beginPath(); ctx.ellipse(x, y - s * 0.75, s * 0.5, s * 0.18, 0, 0, Math.PI * 2); ctx.fill();
  }
  function drawWarning(b) {
    const k = b.t / b.dur, x = px(b.x), y = py(b.y), r = b.r * R;
    ctx.fillStyle = `rgba(255,40,20,${0.12 + k * 0.25})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = `rgba(255,60,30,${0.5 + k * 0.5})`; ctx.lineWidth = 3;
    ctx.setLineDash([8, 6]); ctx.lineDashOffset = -time * 30;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,90,40,.55)';
    ctx.beginPath(); ctx.arc(x, y, r * k, 0, Math.PI * 2); ctx.fill();
  }
  function drawBombFlight(b) {
    const k = b.t / b.dur;
    const sx = CX, sy = CY, ex = px(b.x), ey = py(b.y);
    const x = sx + (ex - sx) * k, h = Math.sin(k * Math.PI) * R * 0.9, y = sy + (ey - sy) * k - h;
    const s = R * (0.035 + Math.sin(k * Math.PI) * 0.02);
    const g = ctx.createRadialGradient(x, y, 0, x, y, s * 2.2);
    g.addColorStop(0, 'rgba(255,200,80,.9)'); g.addColorStop(1, 'rgba(255,80,20,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, s * 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5a2a16'; ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff6a1f'; ctx.beginPath(); ctx.arc(x - s * 0.25, y - s * 0.25, s * 0.45, 0, Math.PI * 2); ctx.fill();
  }
  function drawPuddle(p) {
    const k = p.t / p.life, x = px(p.x), y = py(p.y), r = p.r * R * (0.8 + 0.2 * (1 - k));
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(255,220,120,${0.9 * (1 - k)})`); g.addColorStop(0.5, `rgba(255,106,31,${0.85 * (1 - k)})`); g.addColorStop(1, `rgba(120,30,10,${0.5 * (1 - k)})`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  function drawDino() {
    if (inv > 0 && Math.floor(inv * 12) % 2 === 0) return;
    const x = px(dino.x), y = py(dino.y), s = R * DINO_R, f = dino.face;
    const moving = Math.hypot(dino.vx, dino.vy) > 0.08;
    const leg = moving ? Math.sin(dino.step) * s * 0.25 : 0;
    const bounce = moving ? Math.abs(Math.sin(dino.step)) * s * 0.12 : 0;
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(x, y + s * 0.95, s * 1.1, s * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(x, y - bounce); ctx.scale(f, 1);
    const body = '#5ccf7a', dark = '#2f9a54', belly = '#d9f7c4';
    // tail
    ctx.fillStyle = body; ctx.beginPath(); ctx.moveTo(-s * 0.6, -s * 0.1); ctx.quadraticCurveTo(-s * 1.6, s * 0.1, -s * 1.7, -s * 0.5); ctx.quadraticCurveTo(-s * 1.2, s * 0.45, -s * 0.4, s * 0.45); ctx.fill();
    // legs
    ctx.fillStyle = dark;
    ctx.fillRect(-s * 0.45 + leg, s * 0.4, s * 0.3, s * 0.5);
    ctx.fillRect(s * 0.15 - leg, s * 0.4, s * 0.3, s * 0.5);
    // body
    ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, s * 0.1, s * 0.8, s * 0.6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(s * 0.15, s * 0.3, s * 0.45, s * 0.32, 0, 0, Math.PI * 2); ctx.fill();
    // spikes
    ctx.fillStyle = '#ff9f1c';
    for (let i = 0; i < 4; i++) { const sx = -s * 0.75 + i * s * 0.35; ctx.beginPath(); ctx.moveTo(sx, -s * 0.38 + i * -0.02 * s); ctx.lineTo(sx + s * 0.15, -s * 0.72); ctx.lineTo(sx + s * 0.3, -s * 0.42); ctx.fill(); }
    // head
    ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(s * 0.75, -s * 0.45, s * 0.55, s * 0.45, 0, 0, Math.PI * 2); ctx.fill();
    // eye
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s * 0.9, -s * 0.6, s * 0.17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.arc(s * 0.95, -s * 0.58, s * 0.09, 0, Math.PI * 2); ctx.fill();
    // cheek + smile
    ctx.fillStyle = 'rgba(255,120,140,.6)'; ctx.beginPath(); ctx.arc(s * 0.85, -s * 0.3, s * 0.09, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = Math.max(1.5, s * 0.06);
    ctx.beginPath(); ctx.arc(s * 1.05, -s * 0.38, s * 0.15, 0.2, 1.3); ctx.stroke();
    // little arm
    ctx.strokeStyle = dark; ctx.lineWidth = s * 0.14; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s * 0.5, s * 0.1); ctx.lineTo(s * 0.75, s * 0.2 + leg * 0.3); ctx.stroke();
    ctx.restore();
  }
  function drawJoystick() {
    if (!input.active) return;
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(input.ox, input.oy, 50, 0, Math.PI * 2); ctx.stroke();
    let dx = input.x - input.ox, dy = input.y - input.oy; const d = Math.hypot(dx, dy);
    if (d > 50) { dx = dx / d * 50; dy = dy / d * 50; }
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.beginPath(); ctx.arc(input.ox + dx, input.oy + dy, 22, 0, Math.PI * 2); ctx.fill();
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 12 * shake, (Math.random() - 0.5) * 12 * shake);
    drawSea(); drawIsland();
    if (state !== 'menu') {
      puddles.forEach(drawPuddle);
      bombs.forEach(drawWarning);
    }
    // depth-sort objects by y
    const objs = palms.map(p => ({ y: p[1], draw: () => drawPalm(p[0], p[1]) }));
    objs.push({ y: 0, draw: drawVolcano });
    if (state !== 'menu') {
      eggs.forEach(e => objs.push({ y: e.y, draw: () => drawEgg(e) }));
      berries.forEach(b => objs.push({ y: b.y, draw: () => drawBerry(b) }));
      objs.push({ y: dino.y, draw: drawDino });
    }
    objs.sort((a, b) => a.y - b.y).forEach(o => o.draw());
    if (state !== 'menu') {
      bombs.forEach(drawBombFlight);
      parts.forEach(p => { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(px(p.x), py(p.y), p.r * R, 0, Math.PI * 2); ctx.fill(); });
      ctx.globalAlpha = 1;
      ctx.textAlign = 'center'; ctx.font = `${Math.round(R * 0.09)}px "Russo One", "Arial Black", sans-serif`;
      floatTexts.forEach(f => {
        ctx.globalAlpha = 1 - f.t; ctx.fillStyle = f.color; ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 4;
        const x = px(f.x), y = py(f.y) - f.t * R * 0.15 - R * 0.06;
        ctx.strokeText(f.text, x, y); ctx.fillText(f.text, x, y);
      });
      ctx.globalAlpha = 1;
      drawJoystick();
    }
    ctx.restore();
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (state === 'play') update(dt);
    else if (state === 'menu') time += dt;
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- screens ----------
  function start() {
    initAudio(); if (audio && audio.state === 'suspended') audio.resume();
    reset(); state = 'play';
    startScreen.hidden = true; overScreen.hidden = true; pauseScreen.hidden = true; hud.hidden = false;
  }
  function gameOver() {
    state = 'over'; input.active = false;
    if (score > best) { best = score; store.set('dino-island-best', String(best)); $('finalText').textContent = 'Новый рекорд!'; }
    else $('finalText').textContent = 'яиц собрано';
    $('finalScore').textContent = score; showBest();
    setTimeout(() => { overScreen.hidden = false; $('againBtn').focus(); }, 600);
  }
  function togglePause() {
    if (state === 'play') { state = 'pause'; pauseScreen.hidden = false; input.active = false; }
    else if (state === 'pause') { state = 'play'; pauseScreen.hidden = true; last = performance.now(); }
  }
  $('startBtn').addEventListener('click', start);
  $('againBtn').addEventListener('click', start);
  $('pauseBtn').addEventListener('click', togglePause);
  $('resumeBtn').addEventListener('click', togglePause);
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });
})();
</script>
<!--GAME-END-->
</body>
</html>
