name: Stone Age desktop builds

on:
  push:
    paths:
      - 'stone-age/**'
      - '.github/workflows/stone-age-build.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: stone-age
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stone-age/package-lock.json
      - run: npm ci
      - name: Balance check (bot playthrough must finish)
        run: node tools/simulate.js 1
      - name: Package
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: stuck-in-the-stone-age-${{ runner.os }}
          path: |
            stone-age/dist/*.zip
            stone-age/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
