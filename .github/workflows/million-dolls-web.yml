# Publishes the browser version of Million Dolls to the gh-pages branch so it can be played from a link.
# One-time setup in the repository: Settings → Pages → Build and deployment → Source: "Deploy from a branch",
# Branch: gh-pages, folder: / (root). The game is then at https://<owner>.github.io/<repo>/
name: Million Dolls web version

on:
  push:
    branches: [main, master, claude/fervent-fermat-ff7f8f]
    paths: ['million-dolls/src/**', '.github/workflows/million-dolls-web.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: million-dolls-web
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p site
          cp -r million-dolls/src/. site/
          touch site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Million Dolls web build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
